    <rect x="378" y="200" width="104" height="34" rx="17" fill="#161b22" stroke="#3fb950"/>
    <text x="430" y="222" text-anchor="middle" fill="#3fb950" font-size="14">Python</text>
    <rect x="492" y="200" width="58" height="34" rx="17" fill="#161b22" stroke="#a371f7"/>
    <text x="521" y="222" text-anchor="middle" fill="#a371f7" font-size="14">C</text>

    <text x="48" y="278" fill="#8b949e" font-size="12" letter-spacing="3">DATA</text>
