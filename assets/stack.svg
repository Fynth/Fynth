    <rect x="592" y="312" width="96" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="640" y="334" text-anchor="middle" fill="#e6edf3" font-size="14">Dioxus</text>

    <text x="48" y="390" fill="#8b949e" font-size="12" letter-spacing="3">SHIP</text>
    <rect x="200" y="368" width="92" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="246" y="390" text-anchor="middle" fill="#e6edf3" font-size="14">Docker</text>
    <rect x="302" y="368" width="84" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="344" y="390" text-anchor="middle" fill="#e6edf3" font-size="14">Linux</text>
    <rect x="396" y="368" width="86" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="439" y="390" text-anchor="middle" fill="#e6edf3" font-size="14">Nginx</text>
    <rect x="492" y="368" width="148" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="566" y="390" text-anchor="middle" fill="#e6edf3" font-size="14">GitHub Actions</text>
