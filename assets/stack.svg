<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc">
  <title id="title">Rasul. Moscow. Languages and tools.</title>
  <desc id="desc">Rust, Go, Python, C. PostgreSQL, SQLite, MySQL, ClickHouse, Redis. Tokio, Django, REST, Celery, Dioxus. Docker, Linux, Nginx, GitHub Actions.</desc>
  <defs>
    <style>
      .bg { fill: #0b0f14; }
      .frame { fill: none; stroke: #30363d; }
      .title { fill: #f0f6fc; }
      .sub { fill: #c9d1d9; }
      .muted { fill: #8b949e; }
      .tile { fill: #12181f; }
      .chip { fill: #161b22; stroke: #30363d; }
      .chip-t { fill: #e6edf3; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f6f8fa; }
        .frame { stroke: #d0d7de; }
        .title { fill: #1f2328; }
        .sub { fill: #424a53; }
        .muted { fill: #656d76; }
        .tile { fill: #ffffff; }
        .chip { fill: #ffffff; stroke: #d0d7de; }
        .chip-t { fill: #1f2328; }
      }
    </style>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f78166"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1080" height="460" rx="20"/>
  <rect class="frame" x="1" y="1" width="1078" height="458" rx="19"/>

  <text x="48" y="40" fill="#8b949e" class="muted" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="6">FYNTH</text>
  <text x="48" y="92" class="title" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="700">Rasul</text>
  <text x="48" y="124" class="sub" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">Backend and systems · Moscow</text>
  <rect x="48" y="140" width="180" height="3" rx="2" fill="url(#rule)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect class="tile" x="48" y="164" width="234" height="118" rx="16" stroke="#f78166" stroke-opacity="0.7"/>
    <rect x="48" y="164" width="234" height="4" rx="2" fill="#f78166"/>
    <text x="165" y="222" text-anchor="middle" fill="#f78166" font-size="28" font-weight="700">Rust</text>
    <text x="165" y="252" text-anchor="middle" class="muted" font-size="13">native · async</text>

    <rect class="tile" x="298" y="164" width="234" height="118" rx="16" stroke="#58a6ff" stroke-opacity="0.7"/>
    <rect x="298" y="164" width="234" height="4" rx="2" fill="#58a6ff"/>
    <text x="415" y="222" text-anchor="middle" fill="#58a6ff" font-size="28" font-weight="700">Go</text>
    <text x="415" y="252" text-anchor="middle" class="muted" font-size="13">net/http · services</text>

    <rect class="tile" x="548" y="164" width="234" height="118" rx="16" stroke="#3fb950" stroke-opacity="0.7"/>
    <rect x="548" y="164" width="234" height="4" rx="2" fill="#3fb950"/>
    <text x="665" y="222" text-anchor="middle" fill="#3fb950" font-size="28" font-weight="700">Python</text>
    <text x="665" y="252" text-anchor="middle" class="muted" font-size="13">Django · scripting</text>

    <rect class="tile" x="798" y="164" width="234" height="118" rx="16" stroke="#a371f7" stroke-opacity="0.7"/>
    <rect x="798" y="164" width="234" height="4" rx="2" fill="#a371f7"/>
    <text x="915" y="222" text-anchor="middle" fill="#a371f7" font-size="28" font-weight="700">C</text>
    <text x="915" y="252" text-anchor="middle" class="muted" font-size="13">systems</text>

    <text x="48" y="328" class="muted" font-size="11" letter-spacing="3">DATA</text>
    <rect class="chip" x="48" y="340" width="128" height="32" rx="16"/>
    <text x="112" y="361" text-anchor="middle" class="chip-t" font-size="13">PostgreSQL</text>
    <rect class="chip" x="186" y="340" width="90" height="32" rx="16"/>
    <text x="231" y="361" text-anchor="middle" class="chip-t" font-size="13">SQLite</text>
    <rect class="chip" x="286" y="340" width="90" height="32" rx="16"/>
    <text x="331" y="361" text-anchor="middle" class="chip-t" font-size="13">MySQL</text>
    <rect class="chip" x="386" y="340" width="122" height="32" rx="16"/>
    <text x="447" y="361" text-anchor="middle" class="chip-t" font-size="13">ClickHouse</text>
    <rect class="chip" x="518" y="340" width="82" height="32" rx="16"/>
    <text x="559" y="361" text-anchor="middle" class="chip-t" font-size="13">Redis</text>

    <text x="48" y="402" class="muted" font-size="11" letter-spacing="3">TOOLS</text>
    <rect class="chip" x="48" y="414" width="84" height="32" rx="16"/>
    <text x="90" y="435" text-anchor="middle" class="chip-t" font-size="13">Tokio</text>
    <rect class="chip" x="142" y="414" width="92" height="32" rx="16"/>
    <text x="188" y="435" text-anchor="middle" class="chip-t" font-size="13">Django</text>
    <rect class="chip" x="244" y="414" width="76" height="32" rx="16"/>
    <text x="282" y="435" text-anchor="middle" class="chip-t" font-size="13">REST</text>
    <rect class="chip" x="330" y="414" width="88" height="32" rx="16"/>
    <text x="374" y="435" text-anchor="middle" class="chip-t" font-size="13">Celery</text>
    <rect class="chip" x="428" y="414" width="92" height="32" rx="16"/>
    <text x="474" y="435" text-anchor="middle" class="chip-t" font-size="13">Dioxus</text>
    <rect class="chip" x="530" y="414" width="90" height="32" rx="16"/>
    <text x="575" y="435" text-anchor="middle" class="chip-t" font-size="13">Docker</text>
    <rect class="chip" x="630" y="414" width="80" height="32" rx="16"/>
    <text x="670" y="435" text-anchor="middle" class="chip-t" font-size="13">Linux</text>
    <rect class="chip" x="720" y="414" width="82" height="32" rx="16"/>
    <text x="761" y="435" text-anchor="middle" class="chip-t" font-size="13">Nginx</text>
    <rect class="chip" x="812" y="414" width="140" height="32" rx="16"/>
    <text x="882" y="435" text-anchor="middle" class="chip-t" font-size="13">GitHub Actions</text>
  </g>
</svg>
