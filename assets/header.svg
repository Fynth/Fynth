<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title">
  <title id="title">Rasul — backend and systems</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090d"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f78166"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <radialGradient id="glowR" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#f78166" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f78166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)" opacity="0.45"/>
  <rect width="1280" height="420" fill="url(#glowR)"/>
  <rect width="1280" height="420" fill="url(#glowB)"/>

  <g opacity="0.9" fill="none" stroke="#30363d" stroke-width="1">
    <circle cx="1080" cy="120" r="70"/>
    <circle cx="1080" cy="120" r="110"/>
    <circle cx="1080" cy="120" r="150"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="1080" cy="120" r="8" fill="#58a6ff">
      <animate attributeName="r" values="6;10;6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="190" r="5" fill="#f78166">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="990" cy="210" r="5" fill="#3fb950">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M980 120 L1040 90 L1080 120 L1140 80" fill="none" stroke="#58a6ff" stroke-width="1.4" opacity="0.7">
    <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M1080 120 L1120 170 L1180 190" fill="none" stroke="#f78166" stroke-width="1.4" opacity="0.7"/>
  <path d="M1080 120 L1030 180 L990 210" fill="none" stroke="#3fb950" stroke-width="1.4" opacity="0.7"/>

  <text x="72" y="128" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="6">FYNTH</text>
  <text x="72" y="198" fill="#f0f6fc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="700">Rasul</text>
  <rect x="74" y="220" width="220" height="3" rx="2" fill="url(#line)">
    <animate attributeName="width" values="80;260;80" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="72" y="268" fill="#c9d1d9" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">Backend and systems developer · Moscow</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect x="72" y="302" width="86" height="32" rx="16" fill="#1c2128" stroke="#f78166" stroke-opacity="0.6"/>
    <text x="115" y="323" text-anchor="middle" fill="#f78166">Rust</text>
    <rect x="168" y="302" width="72" height="32" rx="16" fill="#1c2128" stroke="#58a6ff" stroke-opacity="0.6"/>
    <text x="204" y="323" text-anchor="middle" fill="#58a6ff">Go</text>
    <rect x="250" y="302" width="96" height="32" rx="16" fill="#1c2128" stroke="#3fb950" stroke-opacity="0.6"/>
    <text x="298" y="323" text-anchor="middle" fill="#3fb950">Python</text>
    <rect x="356" y="302" width="58" height="32" rx="16" fill="#1c2128" stroke="#a371f7" stroke-opacity="0.6"/>
    <text x="385" y="323" text-anchor="middle" fill="#a371f7">C</text>
  </g>
</svg>
